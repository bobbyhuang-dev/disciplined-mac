name: Disciplined
options:
  bundleIdPrefix: com.disciplined
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Disciplined:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - AppIcon.icon
        buildPhase: resources
      # Icon Composer document; Xcode compiles it into the app icon, with fallbacks for older macOS.
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
      # Copied as a folder; the app installs it for the user to load into Chrome.
      - path: Extension
        type: folder
        buildPhase: resources
      # Just the Firefox manifest; the app zips it with the shared files from Extension into an .xpi.
      - path: FirefoxExtension
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.disciplined.mac
        PRODUCT_NAME: Disciplined
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Disciplined
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
